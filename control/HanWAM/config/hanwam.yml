experiment:
  name: hanwam
  seed: 20260715
  output_root: control/outputs
  mode: 1
  stages: [train, eval]
  tracking:
    swanlab:
      enabled: false
      project: haier-jk-control
      experiment: hanwam

train:
  mode: 1
  stage: both
  device: auto
  frames_per_block: 12
  history_blocks: 4
  future_blocks: 8
  batch_size: 2048
  limit_transitions: 0
  val_limit_transitions: 0
  stage1:
    epochs: 48
    lr: 0.001
    weight_decay: 0.0001
    loss:
      horizon_gamma: 0.997
      latent_weight: 1.0
      sigreg_weight: 0.06
      sigreg_num_projections: 64
      sigreg_quadrature_points: 17
      sigreg_integration_limit: 5.0
      sigreg_kernel_sigma: 1.0
      sigreg_projection_chunk_size: 16
  stage2:
    epochs: 20
    lr: 0.0008
    weight_decay: 0.0001
    loss:
      physical_weights:
        T_in_delta: 2.0
        electric_kwh_delta: 0.3
      cumulative_T_in_delta_weight: 2.0
      cumulative_electric_kwh_delta_weight: 0.2

method:
  name: hanwam
  checkpoint_template: control/HanWAM/checkpoints/hanwam_mode{mode}.pt
  action_space_by_mode:
    "1":
      # Continuous-compressor constraint: shutdown is not an admissible action.
      freq_target: [10.0, 80.0]
      eev: [100.0, 270.0]
      fan_out: [750.0, 750.0]
  base_action_by_mode:
    "1":
      freq_target: 34.0
      eev: 240.0
      fan_out: 750.0
  model:
    class_name: HanWAMBlockControllerModel
    architecture_version: hanwam_block_v1
    latent_dim: 64
    hidden_dim: 128
    action_latent_dim: 48
    prober_hidden_dim: 128
    prober_action_scale: 0.0
    tcn_layers: 2
    step_seconds: 5.0
    freq_on_threshold_hz: 5.0
    freq_max_hz: 80.0
    compressor_transition_hz: 2.0
    cooling_freq_exponent: 1.10
    cooling_fan_exponent: 0.60
    cooling_fan_reference: 750.0
    cooling_eev_reference: 240.0
    cooling_eev_range: 170.0
    cooling_eev_gain_scale: 0.12
    cooling_eev_effect_min: 0.85
    cooling_eev_effect_max: 1.15
    ua_delta_max_c: 0.0012
    internal_delta_max_c: 0.0040
    cooling_delta_max_c: 0.10
    cooling_lag_alpha_min: 0.70
    cooling_lag_alpha_max: 0.995
    nominal_cooling_delta_c: 0.070
    nominal_cooling_lag_alpha: 0.92
    energy_power_intercept_w: 279.87
    energy_power_linear_w_per_hz: 9.0034
    energy_power_quadratic_w_per_hz2: 0.04494
    energy_eev_anchor: 100.0
    energy_eev_range: 170.0
    energy_eev_correction_max_w: 150.0
  planner:
    algorithm: mppi
    objective: phase_energy_clamp
    timing:
      step_seconds: 5
      frames_per_block: 12
      history_blocks: 4
      future_blocks: 8
      chunk_steps: 12
      control_interval_steps: 2
      horizon_steps: 96
    sampling:
      seed: 123
      num_samples: 512
      num_iterations: 3
      temperature: 0.7
      sample_std_fraction: 0.45
      min_std_fraction: 0.02
    actuator:
      compressor_on_threshold_hz: 10.0
      snap_deadband_freq: true
    first_principles:
      energy:
        reference_kwh_per_hour: 0.6
      phase:
        reach_deadline_fraction: 0.65
        reach_band_c: 0.45
        hold_activation_c: 0.90
        clamp_upper_c: 0.35
        clamp_lower_c: 0.35
        clamp_center_weight: 2.0
        clamp_center_scale_c: 0.45
        clamp_terminal_weight: 0.15
        clamp_terminal_tail_seconds: 120
        clamp_terminal_projection_seconds: 600
      action:
        reference: last_issued_command
        loss: huber
        huber_delta: 0.20
        pre_first_weight: 0.5
        pre_sequence_weight: 0.8
        hold_first_weight: 2.0
        hold_sequence_weight: 1.5
        post_first_weight: 2.5
        post_sequence_weight: 2.0
        correction_weight: 16.0
        correction_base_norm: 0.04
        correction_gain_norm_per_c: 0.18
        correction_deadband_c: 0.12
        correction_max_norm: 0.65
        hold_effort_weight: 2.0
        post_effort_weight: 3.0
        effort_freq_weight: 1.0
        effort_eev_weight: 0.25
        effort_fan_weight: 0.0
        hold_anchor_weight: 50.0
        post_anchor_weight: 80.0
        anchor_freq: 10.0
        anchor_eev: 100.0
        anchor_fan: 750.0
        anchor_freq_deadband: 5.0
        anchor_eev_deadband: 20.0
        anchor_fan_deadband: 0.0
        anchor_freq_weight: 1.0
        anchor_eev_weight: 0.05
        anchor_fan_weight: 0.0
        anchor_gate_c: 0.6
      weights:
        reach: 80.0
        clamp: 140.0
        energy_pre: 0.9
        energy_hold: 1.5
        energy_post: 2.0
        action_pre: 4.0
        action_hold: 48.0
        action_post: 64.0
      slew:
        pre_deadline: {freq: 30, eev: 20, fan_out: 100}
        post_deadline: {freq: 6, eev: 10, fan_out: 50}

simulator:
  air_conditioner:
    freq_params:
      on_threshold_hz: 10.0
  environment:
    temperature_model: room_hybrid
    room_hybrid:
      device: cpu

eval:
  mode: 1
  split: test
  max_runs: 1
  horizon_seconds: 14400
  ddl_seconds: 2400
  target_temperature: null
  comfort_band_c: 0.5
  comfort_lower_band_c: 1.0
  comfort_upper_band_c: 0.5
  success_requires_final_band: true
  success_requires_post_reach_band: false
  success_requires_post_deadline_band: true
  scenarios:
    - name: standard_A_4h
      horizon_seconds: 14400
      ddl_seconds: 2400
      control_deadline_seconds: 2400
      reach_deadline_seconds: 2400
      success_requires_post_reach_band: false
      success_requires_post_deadline_band: true
      condition:
        name: A
        indoor_initial_dry_bulb_c: 32
        indoor_initial_wet_bulb_c: 28
        indoor_target_dry_bulb_c: 27
        outdoor_dry_bulb_c: 35
        outdoor_wet_bulb_c: 24
    - name: standard_B_4h
      horizon_seconds: 14400
      ddl_seconds: 2400
      control_deadline_seconds: 2400
      reach_deadline_seconds: 2400
      success_requires_post_reach_band: false
      success_requires_post_deadline_band: true
      condition:
        name: B
        indoor_initial_dry_bulb_c: 30
        indoor_initial_wet_bulb_c: 24
        indoor_target_dry_bulb_c: 27
        outdoor_dry_bulb_c: 30
        outdoor_wet_bulb_c: 20
    - name: standard_C_4h
      horizon_seconds: 14400
      ddl_seconds: 2400
      control_deadline_seconds: 2400
      reach_deadline_seconds: 2400
      # C/X11 is expected to settle below target in room_hybrid; accept it
      # only by reach time and stability, not by the A/B temperature band.
      success_requires_final_band: false
      success_requires_post_reach_band: false
      success_requires_post_deadline_band: false
      condition:
        name: C
        indoor_initial_dry_bulb_c: 28
        indoor_initial_wet_bulb_c: 24
        indoor_target_dry_bulb_c: 27
        outdoor_dry_bulb_c: 27
        outdoor_wet_bulb_c: 18

visualization:
  enabled: true
  per_run_debug: true
  trajectory_compare: false
  save_csv: true
  dpi: 160

data:
  group_dirs:
    include: []
    exclude: [unclassified]
