experiment:
  name: hanwam_design_validation_deploycost_eval
  seed: 20260705
  output_root: control/outputs
  mode: 1
  stages: [eval]
  tracking:
    swanlab:
      enabled: false
      project: haier-jk-control
      experiment: hanwam_design_validation_deploycost_eval

method:
  name: hanwam
  checkpoint_template: control/HanWAM/checkpoints/hanwam_design_validation_mode{mode}.pt
  planner:
    objective: hanwam_simple
    seed: 123
    horizon_steps: 24
    chunk_steps: 6
    control_interval_steps: 6
    num_samples: 64
    num_iterations: 3
    elite_ratio: 0.1
    step_seconds: 5
    reference_schedule: deadline_linear
    deadline_fraction: 0.3
    compressor_on_threshold_hz: 15.0
    snap_deadband_freq: true
    cost_weights:
      tracking: 4.0
      energy: 2.0
      action_smooth: 0.05
      fan: 0.0
      off_fan: 0.03
      action_prior: 0.01

eval:
  mode: 1
  split: test
  max_runs: 1
  horizon_seconds: 600
  ddl_seconds: 600
  target_temperature:
  comfort_band_c: 0.5
  scenarios:
    - name: smoke_10min
      split: test
      max_runs: 1
      horizon_seconds: 600
      ddl_seconds: 600
    - name: one_four_hour
      split: test
      max_runs: 1
      horizon_seconds: 14400
      ddl_seconds: 14400
    - name: full4_four_hour
      split: test
      max_runs: 4
      horizon_seconds: 14400
      ddl_seconds: 14400

visualization:
  enabled: false
  per_run_debug: true
  trajectory_compare: false
  save_csv: true
