experiment:
  name: hanwam_e056_h4_f8_freq_only_poly_energy_v1
  seed: 20260713
  output_root: control/outputs
  mode: 1
  stages:
  - train
  - eval
  tracking:
    swanlab:
      enabled: false
      project: haier-jk-control
      experiment: hanwam_e056_h4_f8_freq_only_poly_energy_v1
train:
  mode: 1
  stage: stage2
  device: auto
  frames_per_block: 12
  history_blocks: 4
  future_blocks: 8
  batch_size: 4096
  limit_transitions: 0
  val_limit_transitions: 0
  stage1:
    epochs: 32
    lr: 0.001
    weight_decay: 0.0001
    checkpoint_every_epochs: 16
    loss:
      horizon_gamma: 0.995
      latent_weight: 1.0
      sigreg_weight: 0.06
      variance_target: 1.0
      sigreg_num_projections: 96
      sigreg_mean_weight: 1.0
  stage2:
    epochs: 50
    lr: 0.0008
    weight_decay: 0.0001
    checkpoint_every_epochs: 25
    loss:
      physical_weights:
        T_in_delta: 2.0
        electric_kwh_delta: 0.0
      cumulative_T_in_delta_weight: 2.0
    stage1_checkpoint: control/HanWAM/checkpoints/hanwam_e046_hard_mech_h4_f8_v1_mode1_stage1.pt
method:
  name: hanwam
  checkpoint_template: control/HanWAM/checkpoints/hanwam_e056_h4_f8_freq_only_poly_energy_v1_mode{mode}.pt
  action_space_by_mode:
    '1':
      freq_target:
      - 0.0
      - 80.0
      eev:
      - 240.0
      - 240.0
      fan_out:
      - 750.0
      - 750.0
  model:
    class_name: HanWAMHardMechanismControllerModel
    latent_dim: 96
    hidden_dim: 192
    action_latent_dim: 64
    prober_hidden_dim: 192
    prober_action_scale: 0.0
    tcn_layers: 3
    freq_on_threshold_hz: 15.0
    freq_max_hz: 80.0
    fan_max: 900.0
    eev_min: 69.0
    eev_max: 480.0
    eev_width_min: 55.0
    eev_width_max: 260.0
    eev_effect_floor: 0.75
    ua_delta_scale: 0.00035
    internal_delta_scale: 0.0015
    cooling_delta_scale: 0.075
    compressor_energy_scale: 1.0
    fan_energy_scale: 0.00045
    energy_model: frequency_polynomial
    energy_step_seconds: 5.0
    energy_power_intercept_w: 329.87
    energy_power_linear_w_per_hz: 9.0034
    energy_power_quadratic_w_per_hz2: 0.04494
    compressor_transition_hz: 2.0
    fan_effect_floor: 0.05
    freq_effect_floor: 0.08
    cop_min: 1.5
    cop_max: 5.0
    mechanism_context_blend: 1.0
  planner:
    algorithm: mppi
    objective: hanwam_e055_first_principles_envelope_v1
    timing:
      step_seconds: 5
      chunk_steps: 12
      control_interval_steps: 2
      future_blocks: 8
      horizon_steps: 96
    sampling:
      seed: 123
      num_samples: 512
      num_iterations: 3
      temperature: 0.7
      sample_std_fraction: 0.45
      min_std_fraction: 0.02
      proposal_action_anchors:
      - - 0.0
        - 240.0
        - 750.0
      - - 40.0
        - 240.0
        - 750.0
      - - 80.0
        - 240.0
        - 750.0
    actuator:
      compressor_on_threshold_hz: 15.0
      snap_deadband_freq: true
    first_principles:
      band_c: 0.45
      terminal_tail_seconds: 120
      terminal_projection_max_seconds: 600
      energy_reference_kwh_per_hour: 0.6
      action_history_ema_tau_seconds: 30
      weights:
        thermal_envelope: 160.0
        terminal: 80.0
        energy: 2.5
        action: 0.5
        action_first_weight: 1.0
        action_sequence_weight: 1.0
eval:
  mode: 1
  split: test
  max_runs: 1
  horizon_seconds: 14400
  ddl_seconds: 14400
  target_temperature: null
  comfort_band_c: 0.5
  success_requires_final_band: true
  success_requires_post_reach_band: true
  scenarios:
  - name: standard_A_4h
    horizon_seconds: 14400
    ddl_seconds: 14400
    control_deadline_seconds: 2400
    reach_deadline_seconds: 2400
    success_requires_post_reach_band: true
    condition:
      name: A
      indoor_initial_dry_bulb_c: 32
      indoor_initial_wet_bulb_c: 28
      indoor_target_dry_bulb_c: 27
      outdoor_dry_bulb_c: 35
      outdoor_wet_bulb_c: 24
  - name: standard_B_4h
    horizon_seconds: 14400
    ddl_seconds: 14400
    control_deadline_seconds: 1200
    reach_deadline_seconds: 1200
    success_requires_post_reach_band: true
    condition:
      name: B
      indoor_initial_dry_bulb_c: 30
      indoor_initial_wet_bulb_c: 26
      indoor_target_dry_bulb_c: 27
      outdoor_dry_bulb_c: 30
      outdoor_wet_bulb_c: 20
  - name: standard_C_4h
    horizon_seconds: 14400
    ddl_seconds: 14400
    control_deadline_seconds: 600
    reach_deadline_seconds: 600
    success_requires_post_reach_band: true
    condition:
      name: C
      indoor_initial_dry_bulb_c: 28
      indoor_initial_wet_bulb_c: 24
      indoor_target_dry_bulb_c: 27
      outdoor_dry_bulb_c: 27
      outdoor_wet_bulb_c: 18
visualization:
  enabled: true
  per_run_debug: true
  trajectory_compare: false
  save_csv: true
  dpi: 160
data:
  group_dirs:
    include: []
    exclude:
    - unclassified
