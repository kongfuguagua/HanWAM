experiment:
  name: hanwam_e060_e56wm_phase_energy_clamp_v1
  seed: 20260713
  output_root: control/outputs
  mode: 1
  stages:
  - eval
  tracking:
    swanlab:
      enabled: false
      project: haier-jk-control
      experiment: hanwam_e060_e56wm_phase_energy_clamp_v1
train:
  mode: 1
  stage: stage2
  device: auto
  frames_per_block: 12
  history_blocks: 4
  future_blocks: 8
method:
  name: hanwam
  checkpoint_template: control/HanWAM/checkpoints/hanwam_e056_h4_f8_freq_only_poly_energy_v1_mode{mode}.pt
  action_space_by_mode:
    '1':
      freq_target:
      - 20.0
      - 80.0
      eev:
      - 100.0
      - 270.0
      fan_out:
      - 750.0
      - 750.0
  base_action_by_mode:
    '1':
      freq_target: 34.0
      eev: 240.0
      fan_out: 750.0
  planner:
    algorithm: mppi
    objective: hanwam_e060_phase_energy_clamp_v1
    timing:
      step_seconds: 5
      frames_per_block: 12
      history_blocks: 4
      future_blocks: 8
      chunk_steps: 12
      control_interval_steps: 2
      horizon_steps: 96
    sampling:
      seed: 123
      num_samples: 512
      num_iterations: 3
      temperature: 0.7
      sample_std_fraction: 0.45
      min_std_fraction: 0.02
      proposal_action_anchors:
      - - 20.0
        - 240.0
        - 750.0
      - - 25.0
        - 240.0
        - 750.0
      - - 30.0
        - 240.0
        - 750.0
      - - 35.0
        - 240.0
        - 750.0
      - - 40.0
        - 240.0
        - 750.0
      - - 45.0
        - 240.0
        - 750.0
      - - 50.0
        - 240.0
        - 750.0
      - - 55.0
        - 240.0
        - 750.0
      - - 60.0
        - 240.0
        - 750.0
      - - 65.0
        - 240.0
        - 750.0
      - - 70.0
        - 240.0
        - 750.0
      - - 75.0
        - 240.0
        - 750.0
      - - 80.0
        - 240.0
        - 750.0
    actuator:
      compressor_on_threshold_hz: 15.0
      snap_deadband_freq: true
    first_principles:
      energy:
        reference_kwh_per_hour: 0.6
      phase:
        reach_deadline_fraction: 0.65
        reach_band_c: 0.45
        hold_activation_c: 0.90
        clamp_upper_c: 0.35
        clamp_lower_c: 0.35
        clamp_center_weight: 2.0
        clamp_center_scale_c: 0.45
        clamp_terminal_weight: 0.15
        clamp_terminal_tail_seconds: 120
        clamp_terminal_projection_seconds: 600
      action:
        reference: last_issued_command
        loss: huber
        huber_delta: 0.20
        pre_first_weight: 0.5
        pre_sequence_weight: 0.8
        hold_first_weight: 2.0
        hold_sequence_weight: 1.5
        post_first_weight: 2.5
        post_sequence_weight: 2.0
        correction_weight: 16.0
        correction_base_norm: 0.04
        correction_gain_norm_per_c: 0.18
        correction_deadband_c: 0.12
        correction_max_norm: 0.65
        hold_effort_weight: 1.0
        post_effort_weight: 1.2
        effort_freq_weight: 1.0
        effort_eev_weight: 0.0
        effort_fan_weight: 0.0
        hold_anchor_weight: 20.0
        post_anchor_weight: 30.0
        anchor_freq: 34.0
        anchor_eev: 240.0
        anchor_fan: 750.0
        anchor_freq_deadband: 8.0
        anchor_eev_deadband: 0.0
        anchor_fan_deadband: 0.0
        anchor_freq_weight: 1.0
        anchor_eev_weight: 0.0
        anchor_fan_weight: 0.0
        anchor_gate_c: 0.6
      weights:
        reach: 160.0
        clamp: 100.0
        energy_pre: 0.15
        energy_hold: 1.0
        energy_post: 1.5
        action_pre: 2.0
        action_hold: 24.0
        action_post: 32.0
      slew:
        pre_deadline:
          freq: 30
          eev: 20
          fan_out: 100
        post_deadline:
          freq: 6
          eev: 10
          fan_out: 50
simulator:
  environment:
    temperature_model: room_hybrid
    room_hybrid:
      device: cpu
eval:
  mode: 1
  split: test
  max_runs: 1
  horizon_seconds: 14400
  ddl_seconds: 14400
  target_temperature: null
  comfort_band_c: 0.5
  success_requires_final_band: true
  success_requires_post_reach_band: true
  scenarios:
  - name: standard_A_4h
    horizon_seconds: 14400
    ddl_seconds: 14400
    control_deadline_seconds: 2400
    reach_deadline_seconds: 2400
    success_requires_post_reach_band: true
    condition:
      name: A
      indoor_initial_dry_bulb_c: 32
      indoor_initial_wet_bulb_c: 28
      indoor_target_dry_bulb_c: 27
      outdoor_dry_bulb_c: 35
      outdoor_wet_bulb_c: 24
  - name: standard_B_4h
    horizon_seconds: 14400
    ddl_seconds: 14400
    control_deadline_seconds: 1200
    reach_deadline_seconds: 1200
    success_requires_post_reach_band: true
    condition:
      name: B
      indoor_initial_dry_bulb_c: 30
      indoor_initial_wet_bulb_c: 26
      indoor_target_dry_bulb_c: 27
      outdoor_dry_bulb_c: 30
      outdoor_wet_bulb_c: 20
  - name: standard_C_4h
    horizon_seconds: 14400
    ddl_seconds: 14400
    control_deadline_seconds: 600
    reach_deadline_seconds: 600
    success_requires_post_reach_band: true
    condition:
      name: C
      indoor_initial_dry_bulb_c: 28
      indoor_initial_wet_bulb_c: 24
      indoor_target_dry_bulb_c: 27
      outdoor_dry_bulb_c: 27
      outdoor_wet_bulb_c: 18
visualization:
  enabled: true
  per_run_debug: true
  trajectory_compare: false
  save_csv: true
  dpi: 160
data:
  group_dirs:
    include: []
    exclude:
    - unclassified
