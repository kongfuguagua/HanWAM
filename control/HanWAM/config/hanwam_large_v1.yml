experiment:
  name: hanwam_large_v1
  seed: 20260705
  output_root: control/outputs
  mode: 1
  stages: [train, eval]
  tracking:
    swanlab:
      enabled: false
      project: haier-jk-control
      experiment: hanwam_large_v1

data:
  root: data/dataset
  manifest: data/split_manifest.csv
  format: grouped_status_csv
  encoding: gbk
  group_dirs:
    include: [X1, X2, X3, X4, X5, X8, X11, X16, X17]
    exclude: [unclassified]
  split:
    strategy: manifest_source_round
    train:
      source_contains: ["1轮", "0414~0424"]
    val:
      source_contains: ["2轮"]
    test:
      source_contains: ["3轮"]
  sampling:
    step_seconds: 5
    interpolation_limit: 2
    min_run_steps: 3

simulator:
  air_conditioner:
    step_seconds: 5
    freq_cap_by_mode:
      "1": 90.0
      "3": 110.0
    freq_params: {}
  environment:
    step_seconds: 5
    max_airflow_m3h: 650.0
    rated_fan_rpm: 1050.0
    air_density_kg_m3: 1.2
    room_heat_capacity_kj_per_c: 90.0
    passive_heat_tau_seconds: 14400.0

train:
  mode: 1
  stage: both
  device: auto
  history_steps: 12
  horizon_steps: 36
  limit_transitions: 32768
  val_limit_transitions: 8192
  stage1:
    epochs: 20
    checkpoint_epochs: [20]
    batch_size: 512
    lr: 0.001
    weight_decay: 0.0001
    loss:
      latent_weight: 1.0
      sigreg_weight: 0.08
      sigreg_num_projections: 96
      sigreg_mean_weight: 1.0
      horizon_gamma: 0.985
      variance_target: 1.0
  stage2:
    epochs: 10
    checkpoint_epochs: [10]
    batch_size: 512
    lr: 0.001
    weight_decay: 0.0001
    loss:
      physical_weights:
        T_in: 1.0
        freq: 1.0
        T_in_delta: 2.5
        electric_kwh_delta: 1.0

method:
  name: hanwam
  checkpoint_template: control/HanWAM/checkpoints/hanwam_large_v1_mode{mode}.pt
  model:
    class_name: HanWAM
    latent_dim: 96
    hidden_dim: 192
    action_latent_dim: 48
    tcn_layers: 2
  planner:
    objective: hanwam_simple
    seed: 123
    horizon_steps: 24
    chunk_steps: 6
    control_interval_steps: 6
    num_samples: 80
    num_iterations: 3
    elite_ratio: 0.1
    step_seconds: 5
    reference_schedule: deadline_linear
    deadline_fraction: 0.3
    compressor_on_threshold_hz: 15.0
    snap_deadband_freq: true
    cost_weights:
      tracking: 4.0
      energy: 2.0
      action_smooth: 0.05
      fan: 0.03
      off_fan: 0.20
  action_space_by_mode:
    "1":
      freq_target: [0.0, 90.0]
      eev: [69.0, 480.0]
      fan_out: [0.0, 850.0]
    "3":
      freq_target: [0.0, 110.0]
      eev: [100.0, 480.0]
      fan_out: [0.0, 800.0]
  base_action_by_mode:
    "1": {freq_target: 40.2, eev: 165.0, fan_out: 750.0}
    "3": {freq_target: 22.0, eev: 105.0, fan_out: 800.0}

eval:
  mode: 1
  split: test
  max_runs: 1
  horizon_seconds: 600
  ddl_seconds: 600
  target_temperature:
  comfort_band_c: 0.5
  scenarios:
    - name: smoke_10min
      split: test
      max_runs: 1
      horizon_seconds: 600
      ddl_seconds: 600
    - name: one_four_hour
      split: test
      max_runs: 1
      horizon_seconds: 14400
      ddl_seconds: 14400
    - name: full4_four_hour
      split: test
      max_runs: 4
      horizon_seconds: 14400
      ddl_seconds: 14400

visualization:
  enabled: false
  per_run_debug: true
  trajectory_compare: false
  save_csv: true
