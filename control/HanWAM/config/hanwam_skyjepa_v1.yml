experiment:
  name: hanwam_skyjepa_v1
  seed: 20260706
  output_root: control/outputs
  mode: 1
  stages: [train, eval]
  tracking:
    swanlab:
      enabled: false
      project: haier-jk-control
      experiment: hanwam_skyjepa_v1

train:
  mode: 1
  stage: both
  device: auto
  history_steps: 12
  horizon_steps: 24
  limit_transitions: 32768
  val_limit_transitions: 8192
  stage1:
    epochs: 20
    checkpoint_epochs: [10, 14, 18, 20]
    batch_size: 1024
    lr: 0.001
    weight_decay: 0.0001
    loss:
      latent_weight: 1.0
      sigreg_weight: 0.05
      sigreg_num_projections: 64
      sigreg_mean_weight: 1.0
      horizon_gamma: 0.98
      variance_target: 1.0
  stage2:
    epochs: 10
    checkpoint_epochs: [4, 6, 8, 10]
    batch_size: 1024
    lr: 0.001
    weight_decay: 0.0001
    loss:
      physical_weights:
        T_in: 1.0
        freq: 1.0
        T_in_delta: 2.0
        electric_kwh_delta: 1.0

method:
  name: hanwam
  checkpoint_template: control/HanWAM/checkpoints/hanwam_skyjepa_v1_mode{mode}.pt
  model:
    class_name: HanWAM
    latent_dim: 64
    hidden_dim: 128
    action_latent_dim: 32
    tcn_layers: 2
  planner:
    objective: hanwam_simple
    seed: 123
    horizon_steps: 24
    chunk_steps: 6
    control_interval_steps: 6
    num_samples: 64
    num_iterations: 3
    elite_ratio: 0.1
    step_seconds: 5
    reference_schedule: deadline_linear
    deadline_fraction: 0.3
    compressor_on_threshold_hz: 15.0
    snap_deadband_freq: true
    cost_weights:
      tracking: 4.0
      energy: 2.0
      action_smooth: 0.05

eval:
  mode: 1
  split: test
  max_runs: 1
  horizon_seconds: 600
  ddl_seconds: 600
  target_temperature:
  comfort_band_c: 0.5
  scenarios:
    - name: smoke_10min
      split: test
      max_runs: 1
      horizon_seconds: 600
      ddl_seconds: 600
    - name: one_four_hour
      split: test
      max_runs: 1
      horizon_seconds: 14400
      ddl_seconds: 14400
    - name: full4_four_hour
      split: test
      max_runs: 4
      horizon_seconds: 14400
      ddl_seconds: 14400

visualization:
  enabled: false
  per_run_debug: true
  trajectory_compare: false
  save_csv: true
