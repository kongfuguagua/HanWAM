experiment:
  name: hanwam_smoke
  seed: 20260705
  output_root: control/outputs
  mode: 1
  stages: [train]
  tracking:
    swanlab:
      enabled: false
      project: haier-jk-control
      experiment: hanwam_smoke

data:
  root: data/dataset
  manifest: data/split_manifest.csv
  format: grouped_status_csv
  encoding: gbk
  group_dirs:
    include: [X1, X2, X3, X4, X5, X8, X11, X16, X17]
    exclude: [unclassified]
  split:
    strategy: manifest_source_round
    train:
      source_contains: ["1轮", "0414~0424"]
    val:
      source_contains: ["2轮"]
    test:
      source_contains: ["3轮"]
  sampling:
    step_seconds: 5
    interpolation_limit: 2
    min_run_steps: 3

simulator:
  environment:
    passive_heat_tau_seconds: 14400.0

train:
  mode: 1
  stage: both
  device: auto
  history_steps: 4
  horizon_steps: 8
  limit_transitions: 256
  val_limit_transitions: 256
  stage1:
    epochs: 1
    batch_size: 128
    lr: 0.001
    weight_decay: 0.0001
    loss:
      latent_weight: 1.0
      sigreg_weight: 0.05
      sigreg_num_projections: 16
      sigreg_mean_weight: 1.0
      horizon_gamma: 0.98
      variance_target: 1.0
  stage2:
    epochs: 1
    batch_size: 128
    lr: 0.001
    weight_decay: 0.0001

method:
  name: hanwam
  checkpoint_template: control/HanWAM/checkpoints/hanwam_smoke_mode{mode}.pt
  model:
    class_name: HanWAM
    latent_dim: 32
    hidden_dim: 64
    action_latent_dim: 16
    tcn_layers: 1
  planner:
    objective: hanwam_simple
    seed: 123
    horizon_steps: 8
    chunk_steps: 4
    num_samples: 16
    num_iterations: 2
    elite_ratio: 0.25
    step_seconds: 5
    reference_schedule: deadline_linear
    deadline_fraction: 0.3
    compressor_on_threshold_hz: 15.0
    snap_deadband_freq: true
    cost_weights:
      tracking: 4.0
      energy: 2.0
      action_smooth: 0.05
  action_space_by_mode:
    "1":
      freq_target: [0.0, 90.0]
      eev: [69.0, 480.0]
      fan_out: [0.0, 850.0]

eval:
  mode: 1
  split: test
  max_runs: 1
  horizon_seconds: 600
  ddl_seconds: 600
  target_temperature:
  comfort_band_c: 0.5
  scenarios:
    - name: smoke_10min
      split: test
      max_runs: 1
      horizon_seconds: 600
      ddl_seconds: 600

visualization:
  enabled: false
  save_csv: true
