experiment:
  name: historical_mode1
  seed: 2026
  output_root: control/outputs
  mode: 1
  stages: [eval]

data:
  root: data/dataset
  manifest: data/split_manifest.csv
  format: grouped_status_csv
  encoding: gbk
  group_dirs:
    include: [X1, X2, X3, X4, X5, X8, X11, X16, X17]
    exclude: [unclassified]

simulator:
  air_conditioner:
    step_seconds: 5
  environment:
    step_seconds: 5
    room_heat_capacity_kj_per_c: 90.0
    passive_heat_tau_seconds: 14400.0

method:
  name: historical

eval:
  mode: 1
  split: test
  max_runs: 4
  horizon_seconds: 14400
  comfort_band_c: 0.5
  scenarios:
    - name: four_hour_experiment
      split: test
      max_runs: 4
      horizon_seconds: 14400
      ddl_seconds: 14400
