experiment:
  name: pid_mode1
  seed: 2026
  output_root: control/outputs
  mode: 1
  stages: [eval]
  tracking:
    swanlab:
      enabled: false
      project: haier-jk-control
      experiment:

data:
  root: data/dataset
  manifest: data/split_manifest.csv
  format: grouped_status_csv
  encoding: gbk
  group_dirs:
    include: [X1, X2, X3, X4, X5, X8, X11, X16, X17]
    exclude: [unclassified]

simulator:
  air_conditioner:
    step_seconds: 5
  environment:
    step_seconds: 5
    room_heat_capacity_kj_per_c: 90.0
    passive_heat_tau_seconds: 14400.0

method:
  name: pid
  gains_by_mode:
    "1": {kp: 8.0, ki: 0.03, kd: 0.0, integral_limit: 300.0}
    "3": {kp: 8.0, ki: 0.03, kd: 0.0, integral_limit: 300.0}
  base_action_by_mode:
    "1": {freq_target: 40.2, eev: 165.0, fan_out: 750.0}
    "3": {freq_target: 22.0, eev: 105.0, fan_out: 800.0}
  action_space_by_mode:
    "1":
      freq_target: [0.0, 90.0]
      eev: [69.0, 480.0]
      fan_out: [0.0, 850.0]
    "3":
      freq_target: [0.0, 110.0]
      eev: [100.0, 480.0]
      fan_out: [0.0, 800.0]

eval:
  mode: 1
  split: test
  max_runs: 4
  horizon_seconds: 14400
  comfort_band_c: 0.5
  scenarios:
    - name: four_hour_experiment
      split: test
      max_runs: 4
      horizon_seconds: 14400
      ddl_seconds: 14400
